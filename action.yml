name: Agent SkillGuard
description: Scan AI agent skills for supply-chain risk and upload SARIF-ready reports.
author: Gowrav M
inputs:
  path:
    description: Skill directory or directory containing skills.
    required: false
    default: skills
  require-lock:
    description: Require skillguard.lock.json for each admitted skill.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        args=""
        if [ "${{ inputs.require-lock }}" = "true" ]; then
          args="$args --require-lock"
        fi
        npx agent-skillguard admit "${{ inputs.path }}" --sarif $args
branding:
  icon: shield
  color: blue
