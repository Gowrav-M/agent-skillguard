<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Agent SkillGuard terminal demo</title>
  <desc id="desc">A terminal showing Agent SkillGuard scanning agent skills and producing reports.</desc>
  <rect width="980" height="430" rx="8" fill="#101820"/>
  <rect x="0" y="0" width="980" height="42" rx="8" fill="#17212f"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <text x="92" y="26" fill="#d7dee8" font-family="Consolas, monospace" font-size="14">agent-skillguard demo</text>
  <text x="28" y="78" fill="#8bd5ff" font-family="Consolas, monospace" font-size="18">$ npx agent-skillguard demo</text>
  <text x="28" y="116" fill="#f8fafc" font-family="Consolas, monospace" font-size="18">Demo complete</text>
  <text x="28" y="148" fill="#d7dee8" font-family="Consolas, monospace" font-size="18">Skills scanned: 5</text>
  <text x="28" y="180" fill="#d7dee8" font-family="Consolas, monospace" font-size="18">Findings: 6</text>
  <text x="28" y="212" fill="#ffb86b" font-family="Consolas, monospace" font-size="18">Risk score: 100/100</text>
  <text x="28" y="260" fill="#f8fafc" font-family="Consolas, monospace" font-size="18">Artifacts:</text>
  <text x="52" y="292" fill="#a7f3d0" font-family="Consolas, monospace" font-size="16">.skillguard/reports/skillguard-report.json</text>
  <text x="52" y="322" fill="#a7f3d0" font-family="Consolas, monospace" font-size="16">.skillguard/reports/skillguard-report.md</text>
  <text x="52" y="352" fill="#a7f3d0" font-family="Consolas, monospace" font-size="16">.skillguard/reports/skillguard-report.html</text>
  <text x="52" y="382" fill="#a7f3d0" font-family="Consolas, monospace" font-size="16">.skillguard/reports/skillguard-report.sarif</text>
</svg>
